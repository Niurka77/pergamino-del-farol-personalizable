class Ribbon {
  constructor(n, seg, hw, fill, ph){
    this.n = n; this.seg = seg; this.hw = hw; this.ph = ph; this.p = []; this.dir = [-1, 0];
    this.el = document.createElementNS(NS, 'path');

  init(ax, ay){ this.p = []; for (let i = 0; i < this.n; i++){ const x = ax - i * this.seg * .4, y = ay + i * this.seg * .9; this.p.push({ x, y, ox: x, oy: y }); } }
  step(ax, ay, dt, wind, g, t){
    const p = this.p, n = this.n, dt2 = dt * dt;
    p[0].x = ax; p[0].y = ay; p[0].ox = ax; p[0].oy = ay;
    for (let i = 1; i < n; i++){
      const q = p[i], u = i / n, vx = (q.x - q.ox) * .985, vy = (q.y - q.oy) * .985;
      q.ox = q.x; q.oy = q.y;
      const turb = Math.sin(t * 11 + i * .9 + this.ph) * Math.abs(wind) * .2 * u;
      const lf = Math.cos(t * 13 + i * 1.1 + this.ph) * Math.abs(wind) * .16 * u;
      q.x += vx + (wind * (.4 + .6 * u) + turb) * dt2; q.y += vy + (g + lf) * dt2;
    }
    for (let k = 0; k < 5; k++) for (let i = 1; i < n; i++){
      const a = p[i - 1], b = p[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-4, df = (d - this.seg) / d;
      if (i === 1){ b.x -= dx * df; b.y -= dy * df; } else { const f = .5 * df; a.x += dx * f; a.y += dy * f; b.x -= dx * f; b.y -= dy * f; }
    }
  }

    const p = this.p, n = this.n, Lf = [], Rt = [];
    for (let i = 0; i < n; i++){
      const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      const w = this.hw * (1 - .5 * i / (n - 1));

      if (i === n - 1) this.dir = [dx, dy];
    }
    const last = p[n - 1], dx = this.dir[0], dy = this.dir[1], ext = this.seg * .8, f = v => v[0].toFixed(1) + ',' + v[1].toFixed(1);
    const tl = [Lf[n - 1][0] + dx * ext, Lf[n - 1][1] + dy * ext], tr = [Rt[n - 1][0] + dx * ext, Rt[n - 1][1] + dy * ext];
    const nt = [last.x + dx * ext * .15, last.y + dy * ext * .15];

    for (let i = 1; i < n; i++) d += ' L' + f(Lf[i]);
    d += ' L' + f(tl) + ' L' + f(nt) + ' L' + f(tr);
    for (let i = n - 1; i >= 0; i--) d += ' L' + f(Rt[i]);
    this.el.setAttribute('d', d + ' Z');
    let s = ''; [2, 4, 6].forEach(i => { if (i < n - 2) s += 'M' + f(Lf[i]) + ' L' + f(Rt[i]) + ' '; });
    this.st.setAttribute('d', s);
  }
}

function roadD(){

function smoothD(list){

  for (const l of dlgLines){ const dur = Math.max(2.4, l[2].length / 14 + 1.2); if (dlgClock >= l[0] && dlgClock < l[0] + dur){ cur = { who: l[1], text: sub(l[2]), age: dlgClock - l[0], dur }; } }
  const g = $('dlg');
  if (!cur){ g.setAttribute('opacity', 0); AU.dlgN = 0; AU.lastWho = ''; return; }
  const a = ease(cur.age / .2) * (1 - ease((cur.age - (cur.dur - .25)) / .25));
  g.setAttribute('opacity', a.toFixed(2));
  $('dlgTag').textContent = cur.who; const w = cur.who.length * 10 + 30;
  $('dlgTagR').setAttribute('width', w); $('dlgTagR').setAttribute('fill', WHO[cur.who] || '#5a6488');
  $('dlgTag').setAttribute('x', 26 + w / 2);
  const shown = cur.text.slice(0, Math.floor(cur.age * 34)), lines = wrapTxt(cur.text, 44);
  if (cur.who !== AU.lastWho){ AU.lastWho = cur.who; AU.dlgN = 0; }
  if (shown.length > AU.dlgN){ AU.dlgN = shown.length; if (shown.length % 3 === 0) sfx('voice', VOICE_P[cur.who] || 430); }
  let left = shown.length, out = ['', ''];
  lines.slice(0, 2).forEach((ln, i) => { const take = clamp(left, 0, ln.length + 1); out[i] = ln.slice(0, take); left -= ln.length + 1; });
  $('dlgL1').textContent = out[0]; $('dlgL2').textContent = out[1];
}

      const s = scenes[sceneIdx];
      s.update(dt, sceneT);
      renderKiro(dt); updateDust(dt);
      shake *= Math.exp(-12 * dt);
      $('cam').setAttribute('transform', `translate(${((Math.random() - .5) * shake).toFixed(1)},${((Math.random() - .5) * shake).toFixed(1)})`);
      const cap = $('cap'), ct = s.caption || '';
      const full = (sceneIdx + 1) + '. ' + ct + ' \u00b7 ' + NODES[sceneIdx].sello; $('capT').textContent = full; const w = full.length * 9.4 + 50; $('capR').setAttribute('x', (240 - w / 2).toFixed(0)); $('capR').setAttribute('width', w.toFixed(0));
      cap.setAttribute('opacity', (ease((sceneT - .5) / .3) * (1 - ease((sceneT - 3.4) / .4))).toFixed(2));
      const fin = isFinite(s.dur) ? Math.max(1 - sceneT / .5, (sceneT - (s.dur - .5)) / .5, 0) : Math.max(1 - sceneT / .5, 0);
      setInk(fin);
      if (isFinite(s.dur) && sceneT >= s.dur) endScene();
    }
    if (mode === 'scene'){ ambT -= dt; if (ambT <= 0){ ambT = .5; if (fxs.length < 60) addFx('mote', Math.random() * 480, 300 + Math.random() * 240, { vx: (Math.random() - .5) * 16, vy: -10 - Math.random() * 12, life: 3.5, r: 1.8 + Math.random() * 1.4, color: '#ffe9a8' }); } }
    if (mode !== 'credits'){ drawFrog(T); updateFx(dt); drawDlg(); }
    sndTick(dt);
  }
  if (running && started && $('lockG').style.display !== 'none') placeInput();
  if (running) raf = requestAnimationFrame(frame);

}
function boot(){ buildScenes(); setupShow(); resetAll(); requestAnimationFrame(frame); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
